[package]
name = "scry-plugin-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
scry-proto = { path = "../scry-proto" }
wit-bindgen = "0.36.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4"] }

[package]
name = "scry-core"
version = "0.1.0"
edition = "2024"

[dependencies]
scry-proto = { path = "../scry-proto", features = ["backend"] }
scry-plugin-sdk = { path = "../scry-plugin-sdk" }
axum = "0.7.5"
tokio = { version = "1.37.0", features = ["full"] }
sqlx = { version = "0.7.4", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
chrono = { version = "0.4.37", features = ["serde"] }
uuid = { version = "1.8.0", features = ["serde", "v4"] }
utoipa = { version = "5", features = ["uuid", "chrono", "axum_extras"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
anyhow = "1.0.82"
tower-http = { version = "0.5.2", features = ["fs", "trace"] }
wasmtime = { version = "20.0.0", features = ["component-model", "async"] }
wasmtime-wasi = "20.0.0"
async-trait = "0.1.80"
reqwest = { version = "0.12", features = ["json"] }
rust-embed = { version = "8.11.0", features = ["axum"] }
notify = "8.2.0"

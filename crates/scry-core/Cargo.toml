[package]
name = "scry-core"
version.workspace = true
edition = "2024"

[dependencies]
scry-proto = { path = "../scry-proto", features = ["backend"] }
scry-plugin-sdk = { path = "../scry-plugin-sdk" }
axum = "0.7.5"
tokio = { version = "1.37.0", features = ["full"] }
tower = { version = "0.4", features = ["limit"] }
sqlx = { version = "0.7.4", features = ["runtime-tokio-rustls", "sqlite", "uuid", "chrono"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
chrono = { version = "0.4.37", features = ["serde"] }
uuid = { version = "1.8.0", features = ["serde", "v4"] }
utoipa = { version = "5", features = ["uuid", "chrono", "axum_extras"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
anyhow = "1.0.82"
tower-http = { version = "0.6.8", features = ["fs", "trace", "cors", "set-header", "limit"] }
dotenvy = "0.15.7"
argon2 = "0.5.3"
password-hash = "0.5.0"
thiserror = "2.0"
validator = { version = "0.19", features = ["derive"] }
wasmtime = { version = "42.0.1", features = ["component-model", "async", "anyhow", "cache"] }
wasmtime-wasi = "44.0.3"
async-trait = "0.1.80"
reqwest = { version = "0.12", features = ["json"] }
rust-embed = { version = "8.11.0", features = ["axum"] }
notify = "8.2.0"
futures = "0.3.32"
async-stream = "0.3.6"
serde_urlencoded = "0.7.1"
tokio-util = "0.7.18"
ts-rs = { version = "12.0.1", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
governor = "0.10.4"
dashmap = "6.1.0"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
urlencoding = "2.1"

[package]
name = "scry-spotify-plugin"
version.workspace = true
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.53.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4"] }
urlencoding = "2.1"
base64 = "0.22"
scry-plugin-sdk = { path = "../scry-plugin-sdk" }
